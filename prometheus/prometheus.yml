global:
  scrape_interval: 5s        # частый опрос, чтобы короткие провалы (chaos-тест) были видны
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  - job_name: mariadb
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]

  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]

  # Доступность и latency HTTP-сервисов через blackbox exporter.
  # Prometheus просит blackbox «сходить» на каждый target и вернуть probe_success / probe_duration_seconds.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://safeboard-kuma:3001
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
